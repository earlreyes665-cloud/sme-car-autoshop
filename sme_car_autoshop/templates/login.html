{% extends "base.html" %}{% block title %}Sign In · SME Car Autoshop{% endblock %}
{% block public_content %}
<div class="login-page"><div class="login-card">
  <div class="login-logo"><i class="fa-solid fa-wrench"></i></div><div class="eyebrow">SME CAR AUTOSHOP</div>
  <h1>Welcome back</h1><p class="muted">Sign in to manage shop operations.</p>
  <form method="post" action="{{ url_for('login', next=request.args.get('next','')) }}" class="stack-form">
    <label>Username<input name="username" autocomplete="username" required autofocus placeholder="Enter your username"></label>
    <label>Password<input name="password" type="password" autocomplete="current-password" required placeholder="Enter your password"></label>
    <button class="btn btn-primary full-width" type="submit"><i class="fa-solid fa-right-to-bracket"></i> Sign in</button>
  </form>
  <div class="hint"><strong>First run default account</strong><br>Username: <code>admin</code><br>Password: <code>ChangeMe123!</code><br><small>Change this password after login.</small></div>
</div></div>
{% endblock %}
